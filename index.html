<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EML Viewer</title>
    <!-- Tải Tailwind CSS để có giao diện đẹp mắt -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tùy chỉnh font chữ giống Google */
        body {
            font-family: 'Inter', 'Roboto', 'Arial', sans-serif;
        }
        /* Ẩn thanh cuộn của iframe nhưng vẫn cho phép cuộn */
        #email-body::-webkit-scrollbar {
            display: none;
        }
        #email-body {
            -ms-overflow-style: none; /* IE và Edge */
            scrollbar-width: none; /* Firefox */
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white rounded-xl shadow-2xl overflow-hidden w-full max-w-5xl" style="height: 85vh;">
        
        <!-- Màn hình tải file (ban đầu) -->
        <div id="upload-screen" class="flex flex-col items-center justify-center h-full p-10">
            <!-- Icon thư -->
            <svg class="w-24 h-24 text-blue-500 mb-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
            </svg>
            <h1 class="text-2xl font-bold text-gray-700 mb-2">EML Viewer</h1>
            <p class="text-gray-500 mb-8">Upload your .eml file to view the contents.</p>
            <label for="eml-uploader" class="cursor-pointer bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold shadow-md hover:bg-blue-700 transition duration-300">
                Choose file .eml
            </label>
            <input type="file" id="eml-uploader" accept=".eml" class="hidden">
            <p id="error-message" class="text-red-500 mt-4"></p>
        </div>

        <!-- Màn hình xem email (bị ẩn ban đầu) -->
        <div id="viewer-screen" class_name="hidden" class="hidden flex flex-col h-full">
            <!-- Thanh công cụ -->
            <div class="flex items-center p-3 border-b bg-gray-50">
                <button id="back-button" title="Quay lại" class="p-2 rounded-full hover:bg-gray-200">
                    <svg class="w-5 h-5 text-gray-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
                <!-- Các nút giả lập giao diện Gmail -->
                <div class="flex ml-4 space-x-2">
                    <button title="Lưu trữ (chỉ giao diện)" class="p-2 rounded-full hover:bg-gray-200">
                        <svg class="w-5 h-5 text-gray-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
                        </svg>
                    </button>
                    <button title="Xóa (chỉ giao diện)" class="p-2 rounded-full hover:bg-gray-200">
                        <svg class="w-5 h-5 text-gray-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12.502 0c-.34.052-.67.107-1.01.165m11.99-1.398c-.62.093-1.25.167-1.89.22m-9.582 0a47.923 47.923 0 01-1.89-.22m0 0A49.908 49.908 0 013 5.79m14.456 0a49.908 49.908 0 00-3.478-.397m-4.004 0c-.62.093-1.25.167-1.89.22m5.89-1.554l-.346-9M9.26 9l-.346-9" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Tiêu đề (Chủ đề) -->
            <div class="p-4 border-b">
                <h2 id="email-subject" class="text-2xl font-normal text-gray-800"></h2>
            </div>

            <!-- Thông tin người gửi/nhận -->
            <div class="flex items-center p-4 space-x-3 border-b">
                <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white font-bold text-xl" id="email-avatar">
                    <!-- Chữ cái đầu của tên người gửi -->
                </div>
                <div class="flex-1">
                    <div class="flex justify-between items-baseline">
                        <span class="font-semibold text-gray-800" id="email-from"></span>
                        <span class="text-sm text-gray-500" id="email-date"></span>
                    </div>
                    <div class="text-sm text-gray-600">
                        tới <span id="email-to"></span>
                    </div>
                </div>
            </div>

            <!-- Nội dung email -->
            <div class="flex-1 overflow-auto p-1">
                <iframe id="email-body" class="w-full h-full border-0" sandbox="allow-same-origin"></iframe>
            </div>
        </div>
    </div>

    <script>
        const uploadScreen = document.getElementById('upload-screen');
        const viewerScreen = document.getElementById('viewer-screen');
        const uploader = document.getElementById('eml-uploader');
        const backButton = document.getElementById('back-button');
        const errorMessage = document.getElementById('error-message');

        const emailSubject = document.getElementById('email-subject');
        const emailAvatar = document.getElementById('email-avatar');
        const emailFrom = document.getElementById('email-from');
        const emailDate = document.getElementById('email-date');
        const emailTo = document.getElementById('email-to');
        const emailBody = document.getElementById('email-body');

        // Xử lý khi người dùng chọn file
        uploader.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const emlContent = e.target.result;
                        const emailData = parseEml(emlContent);
                        displayEmail(emailData);
                        errorMessage.textContent = ''; // Xóa thông báo lỗi cũ
                    } catch (error) {
                        console.error("Lỗi phân tích file EML:", error);
                        errorMessage.textContent = "Không thể phân tích file EML này. File có thể bị hỏng hoặc có định dạng không hỗ trợ.";
                    }
                };
                reader.onerror = () => {
                     errorMessage.textContent = "Không thể đọc file.";
                }
                reader.readAsText(file, "latin1"); // ĐỌC FILE BẰNG LATIN1 ĐỂ BẢO TOÀN RAW BYTES
            }
        });

        // Nút quay lại màn hình tải lên
        backButton.addEventListener('click', () => {
            viewerScreen.classList.add('hidden');
            viewerScreen.classList.remove('flex');
            uploadScreen.classList.remove('hidden');
            uploadScreen.classList.add('flex');
            uploader.value = ''; // Reset input file
        });

        // Hiển thị nội dung email
        function displayEmail(data) {
            emailSubject.textContent = data.subject || '(Không có chủ đề)';
            
            // Xử lý tên người gửi và avatar
            const fromText = data.from || 'Không rõ';
            emailFrom.textContent = fromText.replace(/<.*?>/g, '').trim(); // Bỏ email chỉ giữ tên
            emailAvatar.textContent = emailFrom.textContent.charAt(0).toUpperCase() || '?';

            emailTo.textContent = (data.to || 'Không rõ').replace(/<.*?>/g, '').trim();
            
            // Định dạng ngày
            try {
                emailDate.textContent = new Date(data.date).toLocaleString('vi-VN', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch (e) {
                emailDate.textContent = data.date || ''; // Hiển thị ngày gốc nếu không định dạng được
            }

            // Hiển thị nội dung HTML của email
            // Sử dụng srcdoc để render HTML an toàn trong iframe
            emailBody.srcdoc = data.body || '<p>Không có nội dung để hiển thị.</p>';

            // Chuyển màn hình
            uploadScreen.classList.add('hidden');
            uploadScreen.classList.remove('flex');
            viewerScreen.classList.remove('hidden');
            viewerScreen.classList.add('flex');
        }

        /**
         * Hàm phân tích nội dung file EML (Phiên bản đơn giản)
         * Hàm này sử dụng regex và sẽ hoạt động với các file EML cơ bản.
         * Nó không hỗ trợ giải mã tất cả các loại encoding phức tạp hoặc attachment.
         */
        function parseEml(emlContent) {
            const headers = {};
            let body = '';

            // Tách phần header và body
            const boundaryMatch = emlContent.match(/boundary="([^"]+)"/);
            let parts;

            if (boundaryMatch) {
                const boundary = boundaryMatch[1];
                parts = emlContent.split(new RegExp(`--${boundary}(--)?`));
                
                // Lấy header từ phần đầu tiên
                const headerLines = parts[0].split(/\r?\n/);
                headerLines.forEach(line => {
                    const [key, ...value] = line.split(':');
                    if (key && value.length > 0) {
                        headers[key.trim().toLowerCase()] = value.join(':').trim();
                    }
                });

                // Tìm phần HTML
                const htmlPart = parts.find(part => 
                    part && part.includes("Content-Type: text/html")
                );

                if (htmlPart) {
                    body = extractBody(htmlPart);
                } else {
                    // Nếu không có HTML, tìm phần text
                    const textPart = parts.find(part => part && part.includes("Content-Type: text/plain"));
                    if (textPart) {
                        // Chuyển text-plain sang HTML để giữ định dạng
                        body = `<pre style="white-space: pre-wrap; word-wrap: break-word; font-family: 'Inter', sans-serif;">${extractBody(textPart)}</pre>`;
                    }
                }

            } else {
                // Trường hợp email đơn giản, không có boundary
                const parts = emlContent.split(/\r?\n\r?\n/);
                const headerLines = parts[0].split(/\r?\n/);
                headerLines.forEach(line => {
                    const [key, ...value] = line.split(':');
                    if (key && value.length > 0) {
                        headers[key.trim().toLowerCase()] = value.join(':').trim();
                    }
                });
                body = parts.slice(1).join('\r\n\r\n');
                
                // Kiểm tra encoding cho body đơn giản
                if (headers['content-transfer-encoding'] === 'base64') {
                    body = decodeBase64(body);
                }
            }
            
            // Giải mã các header (Subject, From, To) nếu chúng được mã hóa
            // (ví dụ: =?UTF-8?B?...)
            const decodeHeader = (str) => {
                if (!str) return str;
                // Liên tục giải mã trong trường hợp lồng nhau (hiếm gặp nhưng có thể)
                let decodedStr = str;
                while (/=\?([^?]+)\?([QB])\?([^?]+)\?=/g.test(decodedStr)) {
                    decodedStr = decodedStr.replace(/=\?([^?]+)\?([QB])\?([^?]+)\?=/g, (match, charset, encoding, encodedText) => {
                        try {
                            if (encoding.toUpperCase() === 'B') {
                                // Base64
                                return decodeBase64(encodedText, charset || 'utf-8');
                            } else if (encoding.toUpperCase() === 'Q') {
                                // Quoted-Printable
                                return decodeQuotedPrintable(encodedText, charset || 'utf-8');
                            }
                        } catch(e) {
                            console.error("Lỗi giải mã header:", e);
                            return encodedText; // Trả về text gốc nếu lỗi
                        }
                        return encodedText;
                    });
                }
                return decodedStr;
            };

            return {
                subject: decodeHeader(headers.subject),
                from: decodeHeader(headers.from),
                to: decodeHeader(headers.to),
                date: headers.date,
                body: body
            };
        }

        // ... existing code ... --> Đây là hàm cũ, hàm mới ở dưới
        // function extractBody(part) {
        //     let body = part.split(/\r?\n\r?\n/).slice(1).join('\r\n\r?\n');
        //     if (part.includes("Content-Transfer-Encoding: base64")) {
        //         body = decodeBase64(body);
        //     } else if (part.includes("Content-Transfer-Encoding: quoted-printable")) {
        //         body = decodeQuotedPrintable(body);
        //     }
        //     return body;
        // }

        // Hàm trích xuất body thông minh hơn, có xử lý charset
        function extractBody(part) {
            const headersMatch = part.match(/^([\s\S]*?)(\r?\n\r?\n)/);
            const headersStr = headersMatch ? headersMatch[1] : '';
            
            let body;
            if (headersMatch) {
                body = part.substring(headersMatch[0].length);
            } else {
                body = part; // Không có header, có thể là phần nội dung đơn giản
            }

            const charsetMatch = headersStr.match(/charset="([^"]+)"/i) || headersStr.match(/charset=([^;\s]+)/i);
            const charset = charsetMatch ? charsetMatch[1].replace(/"/g, '') : 'utf-8'; // Mặc định là utf-8

            const encodingMatch = headersStr.match(/Content-Transfer-Encoding:\s*(\S+)/i);
            const encoding = encodingMatch ? encodingMatch[1].toLowerCase().trim() : '';

            if (encoding === 'base64') {
                return decodeBase64(body, charset);
            } else if (encoding === 'quoted-printable') {
                return decodeQuotedPrintable(body, charset);
            }
            
            // Không có encoding, nhưng file được đọc là 'latin1'.
            if (charset.toLowerCase() !== 'latin1' && charset.toLowerCase() !== 'iso-8859-1') {
                try {
                    // Chuyển chuỗi latin1 (các byte) thành mảng byte
                    const len = body.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) {
                        bytes[i] = body.charCodeAt(i) & 0xFF;
                    }
                    return new TextDecoder(charset).decode(bytes);
                } catch (e) {
                    console.warn(`Fallback: Không thể giải mã ${charset}, sử dụng latin1.`, e);
                    return body; // Trả về chuỗi latin1 gốc
                }
            }

            return body; // Là plain text hoặc latin1, chỉ cần trả về
        }

        // Hàm giải mã Base64 (an toàn với UTF-8 và các charset khác)
        function decodeBase64(base64, charset = 'utf-8') {
             try {
                // atob hoạt động trên chuỗi latin1 (đó là lý do readAsText('latin1') quan trọng)
                const binStr = atob(base64.replace(/\s/g, ''));
                const len = binStr.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binStr.charCodeAt(i);
                }
                
                // Thử giải mã bằng charset được chỉ định
                try {
                    return new TextDecoder(charset).decode(bytes);
                } catch (e) {
                    console.warn(`Invalid charset '${charset}', falling back to utf-8.`);
                    return new TextDecoder('utf-8').decode(bytes); // Fallback về UTF-8
                }
            } catch (e) {
                console.error("Lỗi giải mã Base64:", e);
                return "Lỗi giải mã nội dung";
            }
        }
        
        // Hàm giải mã Quoted-Printable (phiên bản mạnh mẽ hơn)
        function decodeQuotedPrintable(str, charset = 'utf-8') {
            // Giải mã mã hex. Kết quả là một chuỗi 'latin1'.
            let decodedStr;
            try {
                 decodedStr = str
                    .replace(/=\r?\n/g, '') // Xóa các dấu = ở cuối dòng (line breaks)
                    .replace(/=([A-F0-9]{2})/g, (match, hex) => { // Thay thế mã hex
                        return String.fromCharCode(parseInt(hex, 16));
                    })
                    .replace(/_20/g, ' '); // Thường dùng cho dấu cách trong header
            } catch (e) {
                console.error("Lỗi giải mã QP regex:", e);
                decodedStr = str; // fallback
            }

            // Bây giờ, 'decodedStr' là một chuỗi mà mỗi ký tự đại diện cho 1 byte.
            // Chúng ta cần chuyển chuỗi này thành mảng byte.
            const len = decodedStr.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = decodedStr.charCodeAt(i) & 0xFF; // Lấy giá trị byte
            }
            
            // Cuối cùng, giải mã mảng byte này bằng charset chính xác.
            try {
                return new TextDecoder(charset).decode(bytes);
            } catch (e) {
                console.warn(`Invalid charset '${charset}', falling back to utf-8.`);
                return new TextDecoder('utf-8').decode(bytes); // Fallback về UTF-8
            }
        }

    </script>
</body>
</html>
